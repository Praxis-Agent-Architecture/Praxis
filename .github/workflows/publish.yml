name: Publish

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm instead of running a dry release check"
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Set next patch version
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          LATEST_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"
          BASE_VERSION="${LATEST_VERSION:-$CURRENT_VERSION}"
          NEXT_VERSION="$(node -e "const v = process.argv[1].split('.').map(Number); if (v.length !== 3 || v.some(Number.isNaN)) throw new Error('Invalid semver: ' + process.argv[1]); v[2] += 1; console.log(v.join('.'));" "$BASE_VERSION")"
          npm version "$NEXT_VERSION" --no-git-tag-version
          echo "Publishing $PACKAGE_NAME@$NEXT_VERSION"
      - run: npm pack --dry-run
      - name: Publish package
        if: github.event_name == 'push' || inputs.publish == true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
